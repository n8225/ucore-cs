---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  build-multiarch:
    name: Build and push (${{ matrix.arch }})
    runs-on: ubuntu-26.04
    outputs:
      image_name: ${{ steps.meta.outputs.IMAGE_NAME }}
      base_tag: ${{ steps.meta.outputs.BASE_TAG }}
      all_tags: ${{ steps.meta.outputs.ALL_TAGS }}
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
                    
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: just check

      - name: Prepare Metadata and Tags
        id: meta
        shell: bash
        run: |
          IMAGE_NAME=$(just image_name)
          DEFAULT_TAG=$(just generate-default-tag)
          ALL_TAGS=$(just generate-build-tags "${IMAGE_NAME}" "${DEFAULT_TAG}")
          echo "BASE_TAG=${DEFAULT_TAG}" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT
          echo "ALL_TAGS=${ALL_TAGS}" >> $GITHUB_OUTPUT

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Build and Rechunk
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.meta.outputs.IMAGE_NAME }}
          DEFAULT_TAG: ${{ steps.meta.outputs.BASE_TAG }}
        run: |
          just build "${IMAGE_NAME}" "${DEFAULT_TAG}" linux/${{ matrix.arch }}
          just rechunk "${IMAGE_NAME}" "${DEFAULT_TAG}"

          for tag in ${{ steps.meta.outputs.ALL_TAGS }}; do
            ARCH_TAG="${tag}-${{ matrix.arch }}"
            podman tag "${IMAGE_NAME}:${DEFAULT_TAG}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${ARCH_TAG}"
            podman push "${IMAGE_REGISTRY}/${IMAGE_NAME}:${ARCH_TAG}"
          done

  merge-manifests:
    name: Create Manifest
    needs: build-multiarch
    runs-on: ubuntu-26.04
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
           registry: ghcr.io
           username: ${{ github.actor }}
           password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and Push Podman Manifest
        env:
          IMAGE_NAME: ${{ needs.build-multiarch.outputs.IMAGE_NAME }}
          ALL_TAGS: ${{ needs.build-multiarch.outputs.ALL_TAGS }}
        run: |
          for tag in ${ALL_TAGS}; do
            TARGET_TAG="${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
            AMD64_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}-amd64"
            ARM64_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}-arm64"
            
            echo "Merging manifest for tag: $tag"
            
            podman manifest create "$TARGET_TAG" "$AMD64_IMAGE" "$ARM64_IMAGE"
            
            podman manifest push "$TARGET_TAG" "$TARGET_TAG"
          done
